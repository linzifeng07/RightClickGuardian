name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and run tests
        shell: powershell
        run: .\build.ps1 -RunTests

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: RightClickGuardian
          path: artifacts/RightClickGuardian.exe
          if-no-files-found: error
